[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[project]
name = "meeting-record-python-earth"
dynamic = ["version"]
description = 'Meeting AI recorder.'
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
keywords = []
authors = [
  { name = "KIT Environmental Circle, \"Earth\"", email = "kit.earth.sample.cal@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "langchain>=1.4",
  "langchain-google-genai>=4.4",
  "langchain-openai>=1.6",
  "langchain-anthropic>=1.7",
  "langchain-ollama>=1.1",
  "langgraph>=1.2",
  "mcp>=1.30",
  "langchain-mcp-adapters>=0.3.2",
  "pypdf>=6",
  "tiktoken>=0.14",
  "chromadb>=1.5",
  "sounddevice>=0.5.6",
  "numpy>=2.3",
  "Django>=6.1",
]

[project.optional-dependencies]
dev = [
  "Sphinx>=9.1",
  "pydata-sphinx-theme>=0.21",
  "numpydoc>=1.10",
  "pytest>=9.1",
]

[project.urls]
Documentation = "https://github.com/KIT-Environmental-Circle-Earth/meeting-record-python-earth#readme"
Issues = "https://github.com/KIT-Environmental-Circle-Earth/meeting-record-python-earth/issues"
Source = "https://github.com/KIT-Environmental-Circle-Earth/meeting-record-python-earth"

[tool.hatch.version]
path = "src/meeting_record_python_earth/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/meeting_record_python_earth tests}"

[tool.coverage.run]
source_pkgs = ["meeting_record_python_earth", "tests"]
branch = true
parallel = true
omit = [
  "src/meeting_record_python_earth/__about__.py",
]

[tool.coverage.paths]
meeting_record_python_earth = ["src/meeting_record_python_earth", "*/meeting_record_python_earth/src/meeting_record_python_earth"]
tests = ["tests", "*/meeting_record_python_earth/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
